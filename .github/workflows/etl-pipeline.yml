name: ETL Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run Extract
        working-directory: src
        run: |
          source venv/bin/activate
          python src/etl/extract.py
      - name: Notify Success (Mock)
        run: echo "Extract job succeeded!"

  transform:
    runs-on: ubuntu-latest
    needs: extract
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run Transform
        working-directory: src
        run: |
          source venv/bin/activate
          python src/etl/transform.py
      - name: Notify Success (Mock)
        run: echo "Transform job succeeded!"

  load:
    runs-on: ubuntu-latest
    needs: transform
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run Load
        working-directory: src
        run: |
          source venv/bin/activate
          python src/etl/load.py
      - name: Notify Success (Mock)
        run: echo "Load job succeeded!"

  notify_failure:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Notify Failure (Mock)
        run: echo "One of the jobs failed!"
