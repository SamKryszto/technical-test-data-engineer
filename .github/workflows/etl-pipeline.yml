name: ETL Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  extract:
    name: Extract Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Install Dependencies and Run Extract
        run: |
          for i in {1..3}; do
            python -m venv venv && source venv/bin/activate && pip install -r requirements.txt && \
            PYTHONPATH=src python -m etl.extract && break || sleep 10
          done
      - name: Save Extracted Data
        uses: actions/upload-artifact@v3
        with:
          name: raw-data
          path: raw_data.pkl

  transform:
    name: Transform Data
    runs-on: ubuntu-latest
    needs: extract
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Download Extracted Data
        uses: actions/download-artifact@v3
        with:
          name: raw-data
          path: ./  # Root directory
      - name: Install Dependencies and Run Transform
        run: |
          for i in {1..3}; do
            python -m venv venv && source venv/bin/activate && pip install -r requirements.txt && \
            PYTHONPATH=src python -m etl.transform && break || sleep 10
          done
      - name: Save Transformed Data
        uses: actions/upload-artifact@v3
        with:
          name: clean-data
          path: clean_data.pkl

  load:
    name: Load Data and Upload CSVs
    runs-on: ubuntu-latest
    needs: transform
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Download Transformed Data
        uses: actions/download-artifact@v3
        with:
          name: clean-data
          path: ./  # Root directory
      - name: Install Dependencies and Run Load
        run: |
          for i in {1..3}; do
            python -m venv venv && source venv/bin/activate && pip install -r requirements.txt && \
            PYTHONPATH=src python -m etl.load && break || sleep 10
          done
        env:
          PYTHONPATH: src
      - name: Upload Final CSVs
        uses: actions/upload-artifact@v3
        with:
          name: final-csvs
          path: output_data/*.csv

  notify:
    name: Notify Success or Failure
    runs-on: ubuntu-latest
    needs: [extract, transform, load]
    if: always()  # Always run, regardless of success or failure
    steps:
      - name: Notification (Mock)
        run: |
          if [ "${{ needs.load.result }}" == "success" ]; then
            echo "ETL pipeline completed successfully!"
          else
            echo "ETL pipeline failed."
          fi
